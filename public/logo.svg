<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2148c8"/>
      <stop offset="100%" stop-color="#0d2067"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle top-left shine -->
  <ellipse cx="36" cy="22" rx="32" ry="15" fill="rgba(255,255,255,0.07)"/>

  <!-- Gold upward arrow (UpSkill symbol) -->
  <polygon points="50,10 62,29 54,29 54,43 46,43 46,29 38,29" fill="url(#gold)"/>

  <!-- Graduation cap board (flat diamond) -->
  <polygon points="50,51 81,62 50,73 19,62" fill="white"/>

  <!-- Cap body below board -->
  <rect x="40" y="62" width="20" height="14" rx="2" fill="rgba(255,255,255,0.9)"/>

  <!-- Tassel line -->
  <line x1="81" y1="62" x2="81" y2="77" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="81" cy="81" r="4" fill="url(#gold)"/>
</svg>
